name: Validate Homey app

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Homey CLI
        run: npm install --global homey
      - name: Validate
        run: homey app validate --level publish
